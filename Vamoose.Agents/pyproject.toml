[project]
name = "vamoose-agents"
version = "0.1.0"
description = "Vamoose Strands agents, served through the Bedrock AgentCore runtime contract."
requires-python = ">=3.12,<3.15"
dependencies = [
  "strands-agents>=1.59,<2",
  "bedrock-agentcore>=1.24,<2",
  "pydantic>=2.8,<3",
  "ddgs>=9,<10",
  "truststore>=0.10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vamoose_agents*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls real Amazon Bedrock; skipped unless VAMOOSE_LIVE_TESTS=1"]
