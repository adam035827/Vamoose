<section class="trip-new">
  <a class="trip-new__back" routerLink="/">← Your trips</a>
  <div class="trip-new__card card">
    <h1 class="trip-new__title">New trip</h1>
    <p class="muted">Give the trip a name and a destination. You'll plan the details with the Vamoose agent next.</p>

    <form class="trip-new__form" (ngSubmit)="submit()">
      <label class="field">
        <span class="field__label">Trip name</span>
        <input class="input" name="name" maxlength="120" placeholder="Lisbon long weekend" required
          [ngModel]="name()" (ngModelChange)="name.set($event)" />
      </label>
      <label class="field">
        <span class="field__label">Destination</span>
        <input class="input" name="destination" maxlength="200" placeholder="Lisbon, Portugal" required
          [ngModel]="destination()" (ngModelChange)="destination.set($event)" />
      </label>
      <div class="trip-new__dates">
        <label class="field">
          <span class="field__label">Start date <span class="muted">(optional)</span></span>
          <input class="input" type="date" name="startDate" [ngModel]="startDate()" (ngModelChange)="startDate.set($event)" />
        </label>
        <label class="field">
          <span class="field__label">End date <span class="muted">(optional)</span></span>
          <input class="input" type="date" name="endDate" [ngModel]="endDate()" (ngModelChange)="endDate.set($event)" />
        </label>
      </div>
      @if (datesInvalid()) {
        <p class="alert" role="alert">The end date can't be before the start date.</p>
      }
      <label class="field">
        <span class="field__label">Notes for the agent <span class="muted">(optional)</span></span>
        <textarea class="input trip-new__notes" name="notes" maxlength="2000" rows="3"
          placeholder="Budget, where people fly from, must-dos…"
          [ngModel]="notes()" (ngModelChange)="notes.set($event)"></textarea>
      </label>
      @if (error()) {
        <p class="alert" role="alert">{{ error() }}</p>
      }
      <button type="submit" class="btn btn--primary" [disabled]="!canSubmit()">
        {{ busy() ? 'Creating…' : 'Create trip' }}
      </button>
    </form>
  </div>
</section>
